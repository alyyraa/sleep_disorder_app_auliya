<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Sleep Stress Predictor</title><link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}"><link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}"><link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/favicon-48x48.png') }}"><link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"></head>
<body class="dashboard-body d-flex align-items-center min-vh-100"><main class="container"><div class="row justify-content-center"><div class="col-sm-10 col-md-7 col-lg-5"><div class="card border-0 dashboard-card"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Sleep Stress Predictor" class="login-logo"><p class="text-secondary mb-0">Login to the information system.</p></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" novalidate><div class="mb-3"><label for="username" class="form-label fw-semibold">Username</label><input type="text" class="form-control" id="username" name="username" required autofocus></div><div class="mb-4"><label for="password" class="form-label fw-semibold">Password</label><input type="password" class="form-control" id="password" name="password" required></div><button type="submit" class="btn btn-primary w-100 btn-lg"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button></form></div></div></div></div></main></body>
</html>
