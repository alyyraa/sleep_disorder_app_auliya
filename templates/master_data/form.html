{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} {{ label }} - Sleep Stress Predictor{% endblock %}
{% block page_title %}{{ 'Edit' if item else 'Add' }} {{ label }}{% endblock %}
{% block content %}<div class="card border-0 dashboard-card"><div class="card-body p-4"><form method="post" class="row g-3"><div class="col-md-7"><label class="form-label">{{ label }} Name</label><input class="form-control" name="name" required value="{{ request.form.get('name', item.name if item else '') }}"></div><div class="col-12"><a class="btn btn-light" href="{{ url_for('master_data.' ~ endpoint_prefix) }}">Cancel</a><button class="btn btn-primary" type="submit">Save</button></div></form></div></div>{% endblock %}
