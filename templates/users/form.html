{% extends "base.html" %}
{% block title %}{{ 'Edit User' if user else 'Add User' }} - Sleep Stress Predictor{% endblock %}
{% block page_title %}{{ 'Edit User' if user else 'Add User' }}{% endblock %}
{% block content %}
<div class="card border-0 dashboard-card"><div class="card-body p-4"><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="full_name" required value="{{ request.form.get('full_name', user.full_name if user else '') }}"></div><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" required value="{{ request.form.get('username', user.username if user else '') }}"></div><div class="col-md-6"><label class="form-label">Role</label><select class="form-select" name="role"><option value="Admin" {% if request.form.get('role', user.role if user else '') == 'Admin' %}selected{% endif %}>Administrator</option><option value="Employee" {% if request.form.get('role', user.role if user else 'Employee') in ['Employee', 'Staff'] %}selected{% endif %}>Employee</option></select></div><div class="col-md-6"><label class="form-label">Password {% if user %}<small class="text-secondary">(leave blank to keep current)</small>{% endif %}</label><input class="form-control" type="password" name="password" {% if not user %}required{% endif %}></div><div class="col-12"><a href="{{ url_for('users.index') }}" class="btn btn-light">Cancel</a><button type="submit" class="btn btn-primary">Save User</button></div></form></div></div>
{% endblock %}
