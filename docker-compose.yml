version: '3.8'

services:
  sleep-disorder-app:
    build: .
    container_name: sleep_disorder_container
    ports:
      - "5000:5000"
    volumes:
      # SQLite and model artifacts form one deployment state. Keeping them in
      # one volume prevents a database from referring to a different model
      # archive mounted from the host.
      - app_runtime:/data
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_PATH=/data/sleep_disorder.db
      - TZ=Asia/Jakarta
    restart: unless-stopped

volumes:
  app_runtime:
